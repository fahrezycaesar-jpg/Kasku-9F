async function showSystemNotification(title, body) {
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const reg = await navigator.serviceWorker?.ready.catch(() => null);
    const opts = { body, icon:"./icon-192.png", badge:"./icon-192.png", vibrate:[200,100,200], tag:"kas-"+Date.now(), renotify:true };
    if (reg) await reg.showNotification(title, opts);
    else new Notification(title, opts);

}

/* =========================================================================

function jadwalList() {
  const start = new Date(S.config.tanggalMulai || TODAY);
  const today = new Date();
  const out = [];
  const d = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const end = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  while (d <= end) {
    const dow = d.getDay();
    if (dow === 3 || dow === 5) {
      out.push({
        tanggal: dateKey(d), hari: dow === 3 ? "Rabu" : "Jumat",
        weekKey: weekKey(d),
        nominal: dow === 3 ? Number(S.config.kasRabu) : Number(S.config.kasJumat)
      });
    }
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function paidDates(nisn) {
  return new Set(S.pembayaran.filter(p => p.nisn === nisn).map(p => p.tanggal));
}

function studentStats(s) {
  const jad = jadwalList();
  const paid = paidDates(s.nisn);
  const unpaid = jad.filter(j => !paid.has(j.tanggal));
  const batas = Number(S.config.batasTunggakan) || 0;
  return {
    jadwal: jad, lunasCount: jad.length - unpaid.length, unpaid,
    tunggakanCount: unpaid.length,
    tunggakanNominal: unpaid.reduce((a, j) => a + j.nominal, 0),
    batas, lewatBatas: unpaid.length > batas
  };
}

function totals() {
  const masukPembayaran = S.pembayaran.reduce((a, p) => a + Number(p.nominal || 0), 0);
  const masukLain = S.transaksi.filter(t => t.tipe === "masuk").reduce((a, t) => a + Number(t.nominal || 0), 0);
  const keluar = S.transaksi.filter(t => t.tipe === "keluar" && t.status === "disetujui").reduce((a, t) => a + Number(t.nominal || 0), 0);
  return { masuk: masukPembayaran + masukLain, keluar, saldo: masukPembayaran + masukLain - keluar };
}

function pengeluaranPerKategori() {
  const map = {};
  S.transaksi.filter(t => t.tipe === "keluar" && t.status === "disetujui").forEach(t => {
    const k = t.kategori || "Lain-lain";
    map[k] = (map[k] || 0) + Number(t.nominal || 0);
  });
  return map;
}

function expenseSeries(period) {
  const now = new Date();
  const items = [];
  if (period === "minggu") {
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now); d.setDate(d.getDate() - i * 7);
      const k = weekKey(d);
      items.push({ key: k, label: new Date(k + "T00:00:00").toLocaleDateString("id-ID", { day: "2-digit", month: "short" }) });
    }
  } else if (period === "bulan") {
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      items.push({ key: `${d.getFullYear()}-${pad(d.getMonth()+1)}`, label: d.toLocaleDateString("id-ID", { month: "short", year: "2-digit" }) });
    }
  } else {
    for (let i = 4; i >= 0; i--) {
      const y = now.getFullYear() - i;
      items.push({ key: String(y), label: String(y) });
    }
  }
  const keluar = S.transaksi.filter(t => t.tipe === "keluar" && t.status === "disetujui");
  const values = items.map(it => keluar.filter(t => {
    const tg = t.tanggal || (t.waktu || "").slice(0, 10);
    if (!tg) return false;
    if (period === "minggu") return weekKey(new Date(tg)) === it.key;
    if (period === "bulan") return tg.slice(0, 7) === it.key;
    return tg.slice(0, 4) === it.key;
  }).reduce((a, t) => a + Number(t.nominal || 0), 0));
  return { labels: items.map(i => i.label), values };
}

function progressMingguIni() {
  const wk = weekKey(new Date());
  const jad = jadwalList().filter(j => j.weekKey === wk);
  const total = S.siswa.length * jad.length;
  if (!total) return { persen: 0, sudah: 0, total: 0, jadwal: jad };
  const sudah = jad.reduce((acc, j) => acc + S.siswa.filter(s => paidDates(s.nisn).has(j.tanggal)).length, 0);
  return { persen: Math.round((sudah / total) * 100), sudah, total, jadwal: jad };
}

/* =========================================================================
   AUTO NOTIF TUNGGAKAN
   ========================================================================= */
let cekTimer = null;
function scheduleCekTunggakan() {
  if (!S.user || S.user.role === "siswa" || !db) return;
  clearTimeout(cekTimer);
  cekTimer = setTimeout(cekTunggakan, 2500);
}

async function cekTunggakan() {
  if (!S.siswa.length) return;
  const wk = weekKey(new Date());
  for (const s of S.siswa) {
    const st = studentStats(s);
    if (!st.lewatBatas) continue;
    const logId = `${s.nisn}_${wk}`;
    try {
      const snap = await getDoc(doc(db, "logTunggakan", logId));
      if (snap.exists()) continue;
      await setDoc(doc(db, "logTunggakan", logId), {
        nisn: s.nisn, nama: s.nama, weekKey: wk,
        tunggakan: st.tunggakanCount, nominal: st.tunggakanNominal, waktu: nowISO()
      });
      await kirimNotif({
        target: "wali",
        judul: "⚠️ Tunggakan Melewati Batas",
        pesan: `${s.nama} (Absen ${s.absen}) memiliki ${st.tunggakanCount} jadwal tunggakan senilai ${rupiah(st.tunggakanNominal)} — melewati batas ${st.batas} jadwal.`,
        tipe: "warning"
      });
    } catch (e) { console.warn("cek tunggakan", e); }
  }
}

      if (!nisn || !nama || !absen) throw new Error("Semua kolom wajib diisi.");

      const snap = await getDoc(doc(db, "siswa", nisn));
      if (!snap.exists()) throw new Error("NISN tidak terdaftar. Tunggu beberapa saat, sistem sedang menyiapkan data.");
      const data = snap.data();
      if (String(data.nama).trim().toLowerCase() !== nama.toLowerCase())
        throw new Error("Nama lengkap tidak cocok dengan NISN tersebut.");
      if (String(data.absen).trim() !== absen)
        throw new Error("Nomor absen tidak cocok.");

      if (S.loginTab === "bendahara" && !data.isBendahara)
        throw new Error("Akun ini bukan Bendahara. Silakan masuk lewat tab Siswa.");

      loginAs({
        role: S.loginTab === "bendahara" ? "bendahara" : "siswa",
        nisn, nama: data.nama, absen: data.absen
      });
    }
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove("hidden");
  }
});

function loginAs(user) {
  S.user = user;
  localStorage.setItem("kas_session", JSON.stringify(user));
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  S.page = "dashboard";
  subscribeAll();
  subscribeNotif();
  render();
  toast(`Selamat datang, ${user.nama}`, "success");
}

/* =========================================================================
   SUBSCRIPTIONS
   ========================================================================= */
function subscribeAll() {
  S.unsubs.forEach(u => u());
  S.unsubs = [];

  S.unsubs.push(onSnapshot(doc(db, "config", "kelas"), snap => {
    if (snap.exists()) S.config = { ...DEFAULT_CONFIG, ...snap.data() };
    else { setDoc(doc(db, "config", "kelas"), DEFAULT_CONFIG); S.config = { ...DEFAULT_CONFIG }; }
    render();
  }));

  S.unsubs.push(onSnapshot(collection(db, "siswa"), snap => {
    S.siswa = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
    scheduleCekTunggakan();
  }));

  S.unsubs.push(onSnapshot(collection(db, "pembayaran"), snap => {
    S.pembayaran = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
    scheduleCekTunggakan();
  }));

  S.unsubs.push(onSnapshot(collection(db, "transaksi"), snap => {
    S.transaksi = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }));

  S.unsubs.push(onSnapshot(collection(db, "pengajuan"), snap => {
    S.pengajuan = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.waktu || "").localeCompare(a.waktu || ""));
    render();
  }));
}

function subscribeNotif() {
  const targets = S.user.role === "wali" ? ["wali", "all"]
                : S.user.role === "bendahara" ? ["bendahara", "all"]
                : ["siswa", "all"];

  const q = query(collection(db, "notifikasi"), where("target", "in", targets));
  S.unsubs.push(onSnapshot(q, snap => {
    const list = [];
    snap.forEach(d => {
      const n = { id: d.id, ...d.data() };
      if (S.user.role === "siswa" && n.target === "siswa" && n.nisn && n.nisn !== S.user.nisn) return;
      if (S.user.role === "wali" && n.target === "siswa") return;
      if (S.user.role === "bendahara" && n.target === "siswa") return;
      list.push(n);
    });
    list.sort((a, b) => (b.waktu || "").localeCompare(a.waktu || ""));
    S.notif = list;

    if (S.notifInit) {
      snap.docChanges().forEach(ch => {
        if (ch.type !== "added") return;
        const n = { id: ch.doc.id, ...ch.doc.data() };
        if (S.user.role === "siswa" && n.target === "siswa" && n.nisn && n.nisn !== S.user.nisn) return;
        if (S.user.role !== "siswa" && n.target === "siswa") return;
        if (!n.dibaca) onNewNotif(n);
      });
    } else S.notifInit = true;

    renderBell();
    if (S.page === "notif") render();
  }));
}

function unreadCount() { return S.notif.filter(n => !n.dibaca).length; }

function renderBell() {
  const b = document.getElementById("badgeNotif");
  const c = unreadCount();
  b.textContent = c > 99 ? "99+" : c;
  b.classList.toggle("hidden", c === 0);
}

   ========================================================================= */
function render() {
  if (!S.user) return;
  if (document.getElementById("modalRoot").dataset.open === "1") return;

  document.getElementById("hdrKelas").textContent = `${S.config.namaKelas} • ${S.config.tahunAjaran}`;

  const roleLabel = { siswa: "Siswa", bendahara: "Bendahara", wali: "Wali Kelas" }[S.user.role];
  document.getElementById("userChip").innerHTML =
    `<div class="text-[11px] text-emerald-200">${esc(roleLabel)}</div>
     <div class="text-xs font-semibold truncate max-w-[130px]">${esc(S.user.nama)}</div>`;

  const nav = document.getElementById("nav");
  nav.innerHTML = (NAV[S.user.role] || []).map(([p, label]) => `
    <button onclick="go('${p}')"
      class="whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold transition
      ${S.page === p ? "bg-white text-brand-800" : "bg-white/10 text-white hover:bg-white/20"}">

    </button>`).join("");

  document.getElementById("btnNotifHp").classList.toggle("hidden",

}

function weekDates(offset) {
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset * 7);
  const rabu = new Date(d); rabu.setDate(d.getDate() + 2);
  const jumat = new Date(d); jumat.setDate(d.getDate() + 4);
  return { senin: d, rabu, jumat };
}

function kelolaKasPage() {
  const w = weekDates(S.weekOffset);

  const siswa = [...S.siswa].sort((a, b) => (a.absen || 0) - (b.absen || 0));

  const lunasRabu = siswa.filter(s => paidDates(s.nisn).has(rabuKey)).length;
  const lunasJumat = siswa.filter(s => paidDates(s.nisn).has(jumatKey)).length;

  return `

window.ubahMinggu = (delta) => { S.weekOffset += delta; render(); };

window.toggleBayar = async (nisn, tanggal, hari) => {
  try {
    const id = `${nisn}_${tanggal}`;
    const ref = doc(db, "pembayaran", id);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      await deleteDoc(ref);
      toast("Pembayaran dibatalkan", "info");
    } else {
      const s = S.siswa.find(x => x.nisn === nisn);
      await setDoc(ref, {
        nisn, nama: s?.nama || "", tanggal, hari,
        nominal: hari === "Rabu" ? Number(S.config.kasRabu) : Number(S.config.kasJumat),
        oleh: S.user.nama || S.user.role, waktu: nowISO()
      });
      toast("Pembayaran dicatat ✅", "success");
    }
  } catch (e) { toast("Gagal: " + e.message, "error"); }
};

window.openQuickAdd = () => {
  const opts = [...S.siswa].sort((a, b) => (a.absen||0)-(b.absen||0))
    .map(s => `<option value="${esc(s.nisn)}">${esc(s.absen)}. ${esc(s.nama)}</option>`).join("");
  const nominals = [2000, 4000, 5000, 10000, 50000, 100000];

  openModal("⚡ Tambah Nominal Cepat / Saldo Awal", `
    <div class="space-y-3">
      <div>
        <label class="text-xs font-medium text-slate-500">Tujuan</label>
        <select id="qaTarget" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-slate-200">
          <option value="">— Pemasukan Lain / Saldo Awal Kas —</option>
          ${opts}
        </select>
      </div>
      <div>
        <label class="text-xs font-medium text-slate-500">Nominal</label>
        <div class="grid grid-cols-3 gap-2 mt-1">
          ${nominals.map(n => `<button type="button" onclick="document.getElementById('qaNominal').value=${n}" class="py-2 rounded-xl bg-emerald-50 text-emerald-800 text-xs font-bold hover:bg-emerald-100">+${rupiah(n)}</button>`).join("")}
        </div>
        <input id="qaNominal" type="number" placeholder="Nominal lain" class="w-full mt-2 px-3 py-2.5 rounded-xl border border-slate-200" />
      </div>
      <div>
        <label class="text-xs font-medium text-slate-500">Keterangan</label>

      </div>
      <button onclick="submitQuickAdd()" class="w-full bg-brand-700 text-white py-3 rounded-xl font-semibold">Simpan</button>
    </div>
  `);
};

window.submitQuickAdd = async () => {
  try {
    const target = document.getElementById("qaTarget").value;
    const nominal = Number(document.getElementById("qaNominal").value);
    const ket = document.getElementById("qaKet").value.trim() || "Pemasukan cepat";
    if (!nominal || nominal <= 0) return toast("Nominal tidak valid", "error");

    if (target) {
      const s = S.siswa.find(x => x.nisn === target);
      const tgl = dateKey(new Date());
      let id = `${target}_${tgl}`;
      const snap = await getDoc(doc(db, "pembayaran", id));
      if (snap.exists()) id = `${target}_${tgl}_${Date.now()}`;
      await setDoc(doc(db, "pembayaran", id), {
        nisn: target, nama: s?.nama || "", tanggal: tgl,
        hari: new Date().getDay() === 3 ? "Rabu" : new Date().getDay() === 5 ? "Jumat" : "Tambahan",
        nominal, oleh: S.user.nama || S.user.role, keterangan: ket, waktu: nowISO()
      });
      toast("Setoran siswa dicatat ✅", "success");
    } else {
      await addDoc(collection(db, "transaksi"), {
        tipe: "masuk", nominal, kategori: "Saldo Awal",
        keterangan: ket, tanggal: dateKey(new Date()),
        status: "disetujui", oleh: S.user.nama || S.user.role, waktu: nowISO()
      });
      toast("Pemasukan kas dicatat ✅", "success");
    }
    closeModal();
  } catch (e) { toast("Gagal: " + e.message, "error"); }
};

function pengajuanPage() {
  const list = S.pengajuan;
  const pending = list.filter(p => p.status === "menunggu");

  return `
  <div class="space-y-4 fade-in">
    ${S.user.role === "bendahara" ? `
      <button onclick="openFormPengajuan()" class="w-full bg-brand-700 hover:bg-brand-800 text-white py-3 rounded-xl font-semibold transition">
        ➕ Ajukan Penggunaan Uang Kas
      </button>` : ""}

    ${S.user.role === "wali" && pending.length ? `
      <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-sm">
        <b>${pending.length} pengajuan</b> menunggu keputusan Anda.
      </div>` : ""}

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm divide-y divide-slate-50">
      <div class="p-4 font-semibold text-sm text-slate-700">📥 Menunggu Persetujuan (${pending.length})</div>
      ${pending.length === 0 ? `<div class="p-6 text-center text-sm text-slate-400">Tidak ada pengajuan menunggu.</div>` :

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm divide-y divide-slate-50">
      <div class="p-4 font-semibold text-sm text-slate-700">📁 Riwayat Keputusan</div>
      ${done.length === 0 ? `<div class="p-6 text-center text-sm text-slate-400">Belum ada riwayat.</div>` :

function pengajuanCard(p, isPending) {
  const badge = p.status === "disetujui"
    ? `<span class="text-[10px] font-bold px-2 py-1 rounded-full bg-emerald-100 text-emerald-700">DISETUJUI</span>`
    : p.status === "ditolak"
    ? `<span class="text-[10px] font-bold px-2 py-1 rounded-full bg-red-100 text-red-700">DITOLAK</span>`
    : `<span class="text-[10px] font-bold px-2 py-1 rounded-full bg-amber-100 text-amber-700">MENUNGGU</span>`;

  return `
  <div class="p-4 space-y-2">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <div class="text-sm font-semibold truncate">${esc(p.kategori || "Lain-lain")}</div>
        <div class="text-[11px] text-slate-400">${fmtTanggal(p.tanggalPakai || p.waktu)} • oleh ${esc(p.oleh || "-")}</div>

      ${badge}
    </div>
    <div class="text-lg font-bold text-brand-800">${rupiah(p.nominal)}</div>
    <div class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-lg">${esc(p.keterangan || "-")}</div>
    ${p.catatanWali ? `<div class="text-xs text-red-700 bg-red-50 p-2.5 rounded-lg"><b>Catatan Wali:</b> ${esc(p.catatanWali)}</div>` : ""}
    ${isPending && S.user.role === "wali" ? `
      <div class="flex gap-2 pt-1">
        <button onclick="putuskanPengajuan('${p.id}','disetujui')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold py-2 rounded-xl">✓ Setuju</button>
        <button onclick="openTolak('${p.id}')" class="flex-1 bg-red-600 hover:bg-red-700 text-white text-sm font-bold py-2 rounded-xl">✗ Tidak Setuju</button>
      </div>` : ""}
  </div>`;
}

window.submitPengajuan = async () => {
  try {
    const nominal = Number(document.getElementById("pjNominal").value);
    const kategori = document.getElementById("pjKategori").value;
    const tanggalPakai = document.getElementById("pjTanggal").value;
    const keterangan = document.getElementById("pjKet").value.trim();

    await addDoc(collection(db, "pengajuan"), {
      nominal, kategori, tanggalPakai, keterangan,
      status: "menunggu", oleh: S.user.nama, waktu: nowISO()
    });

    await kirimNotif({
      target: "wali",
      judul: "📥 Pengajuan Penggunaan Kas Baru",
      pesan: `Bendahara ${S.user.nama} mengajukan ${rupiah(nominal)} untuk "${kategori}". ${keterangan ? "Ket: " + keterangan : ""}`,
      tipe: "warning"
    });

    toast("Pengajuan terkirim ke Wali Kelas ✅", "success");
    closeModal();
  } catch (e) { toast("Gagal: " + e.message, "error"); }

window.openTolak = (id) => {
  openModal("Alasan Penolakan", `

      <textarea id="tolakCatatan" rows="3" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm" placeholder="Tulis alasan penolakan..."></textarea>

};

window.putuskanPengajuan = async (id, status) => {
  try {
    const p = S.pengajuan.find(x => x.id === id);
    const catatanWali = status === "ditolak"
      ? (document.getElementById("tolakCatatan")?.value.trim() || "Tidak ada catatan.")
      : "";

    await updateDoc(doc(db, "pengajuan", id), {
      status, catatanWali, diputuskanOleh: S.user.nama, waktuKeputusan: nowISO()
    });

    if (status === "disetujui") {
      await addDoc(collection(db, "transaksi"), {
        tipe: "keluar", nominal: Number(p.nominal), kategori: p.kategori,
        keterangan: p.keterangan || "", tanggal: p.tanggalPakai || dateKey(new Date()),
        status: "disetujui", oleh: "Wali Kelas", sumberPengajuan: id, waktu: nowISO()

window.seedSiswa = async (silent = false) => {
  if (!silent && !confirm("Import 31 siswa Kelas IX F ke database?\nSiswa yang sudah ada tidak akan terduplikasi.")) return;
  try {
    const existing = new Set(S.siswa.map(s => s.nisn));
    const toAdd = SEED_SISWA.filter(s => !existing.has(s.nisn));
    if (toAdd.length === 0) return;
    for (const s of toAdd) {
      await setDoc(doc(db, "siswa", s.nisn), {
        nisn: s.nisn, nama: s.nama, absen: s.absen,
        isBendahara: false, waktu: nowISO()
      });
    }
    if (!silent) toast(`${toAdd.length} siswa berhasil diimport ✅`, "success");

};

async function boot() {
  if ("serviceWorker" in navigator) {
    try { await navigator.serviceWorker.register("./sw.js"); } catch (e) { console.warn("SW gagal:", e); }
  }

  if (!FIREBASE_READY) {
    const err = document.getElementById("loginErr");
    err.textContent = "Konfigurasi Firebase belum diisi.";
    err.classList.remove("hidden");
    return;
  }

  try {
    // Cek config, jika belum ada atau tanggalMulai di masa lalu, reset ke hari ini
    const snap = await getDoc(doc(db, "config", "kelas"));
    if (snap.exists()) {
      const data = snap.data();
      if (!data.tanggalMulai || data.tanggalMulai < TODAY) {
        data.tanggalMulai = TODAY;
        await setDoc(doc(db, "config", "kelas"), { tanggalMulai: TODAY }, { merge: true });
      }
      S.config = { ...DEFAULT_CONFIG, ...data };
    } else {
      await setDoc(doc(db, "config", "kelas"), DEFAULT_CONFIG);
      S.config = { ...DEFAULT_CONFIG };
    }

    // AUTO IMPORT SISWA: Kalau data kosong, langsung isi 31 siswa
    const siswaSnap = await getDocs(collection(db, "siswa"));
    if (siswaSnap.empty) {
      await seedSiswa(true); // true = tanpa popup konfirmasi
    }

  } catch (e) { console.warn("boot error", e); }

  const saved = localStorage.getItem("kas_session");
  if (saved) {
    try {
      const u = JSON.parse(saved);
      if (u.role === "wali") {
        S.user = u;
      } else {
        const snap = await getDoc(doc(db, "siswa", u.nisn));
        if (snap.exists()) S.user = { ...u, nama: snap.data().nama, absen: snap.data().absen };
      }
    } catch {}
  }

  if (S.user) {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    subscribeAll();
    subscribeNotif();
    render();
  }
}

boot();
</script>
</body>
</html>
